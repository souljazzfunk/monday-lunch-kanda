<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root {
    --bg: #f7f4ef;
    --panel: #ffffff;
    --ink: #1c1a17;
    --muted: #6b6560;
    --accent: #c45c26;
    --accent2: #2c6e49;
    --chip: #efeae3;
    --border: #e4ddd3;
    --shadow: 0 8px 24px rgba(28,26,23,.08);
    --radius: 14px;
    --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: var(--font); color: var(--ink); background: var(--bg); }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow); z-index: 1000; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 1.05rem; letter-spacing: .02em; }
  header p { margin: 2px 0 0; font-size: .78rem; color: var(--muted); }
  .badge {
    background: var(--accent); color: #fff; font-size: .72rem; font-weight: 700;
    padding: 6px 10px; border-radius: 999px; white-space: nowrap;
  }
  .layout { flex: 1; display: grid; grid-template-columns: minmax(280px, 360px) 1fr; min-height: 0; }
  aside {
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; z-index: 500;
  }
  .filters { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .filters h2 { margin: 0 0 8px; font-size: .8rem; color: var(--muted); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip {
    border: 1px solid var(--border); background: var(--chip); color: var(--ink);
    border-radius: 999px; padding: 5px 10px; font-size: .75rem; cursor: pointer;
    transition: .15s ease;
  }
  .chip.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }
  .toggle-row { display: flex; align-items: center; gap: 8px; font-size: .8rem; }
  .toggle-row input { accent-color: var(--accent2); width: 16px; height: 16px; }
  .list { overflow: auto; flex: 1; padding: 8px; }
  .card {
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
    margin-bottom: 8px; cursor: pointer; background: #fff; transition: .15s ease;
  }
  .card:hover, .card.active { border-color: var(--accent); box-shadow: var(--shadow); }
  .card .name { font-weight: 700; font-size: .92rem; margin: 0 0 4px; }
  .card .meta { font-size: .75rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    display: inline-block; background: #f0ebe4; border-radius: 6px; padding: 1px 6px;
    font-size: .7rem; color: #4a453f;
  }
  .pill.res-yes { background: #e4f2ea; color: #1f6b40; }
  .pill.res-no { background: #f6e8e4; color: #8a3a22; }
  .card .tip { margin: 6px 0 0; font-size: .78rem; color: var(--ink); }
  #map { width: 100%; height: 100%; min-height: 320px; }
  .leaflet-popup-content { margin: 10px 12px; font-family: var(--font); min-width: 180px; }
  .popup-title { font-weight: 700; font-size: .95rem; margin: 0 0 4px; }
  .popup-row { font-size: .78rem; color: var(--muted); margin: 2px 0; }
  .popup-tip { font-size: .8rem; margin-top: 6px; }
  .popup-link { font-size: .75rem; color: var(--accent); }
  .legend {
    position: absolute; right: 12px; bottom: 24px; z-index: 800;
    background: rgba(255,255,255,.95); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; font-size: .72rem; box-shadow: var(--shadow);
  }
  .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); font-size: .85rem; }
  .menu-btn {
    display: none; border: 1px solid var(--border); background: #fff; border-radius: 10px;
    padding: 8px 12px; font-size: .8rem; cursor: pointer;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
    aside { border-right: none; border-top: 1px solid var(--border); order: 2; }
    #map-wrap { order: 1; position: relative; }
    .menu-btn { display: inline-block; }
    aside.collapsed .list { display: none; }
  }
</style>
</head>

<header>
  <div>
    <h1>月曜ランチ難民マップ</h1>
    <p>月曜ランチ営業・異国料理寄り</p>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button class="menu-btn" id="toggleList" type="button">一覧</button>
    <span class="badge" id="countBadge">0件</span>
  </div>
</header>
<div class="layout">
  <aside id="sidebar">
    <div class="filters">
      <h2>ジャンル</h2>
      <div class="chips" id="genreChips"></div>
      <label class="toggle-row">
        <input type="checkbox" id="resOnly" />
        予約可のみ
      </label>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <div id="map-wrap" style="position:relative;min-height:0;">
    <div id="map"></div>
    <div class="legend">
      <div><span style="background:#c45c26"></span>ランチ候補</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const restaurants = DATA.restaurants;

  const genreSet = [...new Set(restaurants.map(r => r.genre))].sort();
  const activeGenres = new Set(genreSet);
  let resOnly = false;
  let selectedId = null;
  const markers = {};

  const chipsEl = document.getElementById('genreChips');
  genreSet.forEach(g => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip active';
    b.textContent = g;
    b.dataset.genre = g;
    b.addEventListener('click', () => {
      if (activeGenres.has(g)) {
        if (activeGenres.size === 1) return;
        activeGenres.delete(g);
        b.classList.remove('active');
      } else {
        activeGenres.add(g);
        b.classList.add('active');
      }
      refresh();
    });
    chipsEl.appendChild(b);
  });

  // All / clear helpers
  const allBtn = document.createElement('button');
  allBtn.type = 'button';
  allBtn.className = 'chip';
  allBtn.textContent = 'すべて';
  allBtn.style.borderStyle = 'dashed';
  allBtn.addEventListener('click', () => {
    genreSet.forEach(g => activeGenres.add(g));
    chipsEl.querySelectorAll('.chip[data-genre]').forEach(c => c.classList.add('active'));
    refresh();
  });
  chipsEl.prepend(allBtn);

  document.getElementById('resOnly').addEventListener('change', (e) => {
    resOnly = e.target.checked;
    refresh();
  });

  document.getElementById('toggleList').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('collapsed');
  });

  const map = L.map('map', { zoomControl: true });
  const TILES = JSON.parse(document.getElementById('tiles').textContent);
  L.tileLayer(TILES.urlTemplate, {
    maxZoom: TILES.maxZoom || 19,
    attribution: TILES.attribution,
    subdomains: TILES.subdomains || 'abc'
  }).addTo(map);

  const pinIcon = L.divIcon({
    className: '',
    html: '<div style="width:16px;height:16px;background:#c45c26;border:2px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.3)"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });
  const pinActive = L.divIcon({
    className: '',
    html: '<div style="width:20px;height:20px;background:#2c6e49;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 10px rgba(0,0,0,.4)"></div>',
    iconSize: [20, 20],
    iconAnchor: [10, 10]
  });

  function resLabel(r) {
    if (r.reservation === 'yes') return '予約可';
    if (r.reservation === 'no') return '予約不可';
    return '予約 要確認';
  }
  function resClass(r) {
    if (r.reservation === 'yes') return 'res-yes';
    if (r.reservation === 'no') return 'res-no';
    return '';
  }

  function popupHtml(r) {
    var links = '';
    if (r.officialUrl) {
      links += '<a class="popup-link" href="' + r.officialUrl + '" target="_blank" rel="noopener">公式サイト</a>';
    }
    if (r.sourceUrl) {
      if (links) links += ' · ';
      links += '<a class="popup-link" href="' + r.sourceUrl + '" target="_blank" rel="noopener">情報源</a>';
    }
    return '<div class="popup-title">' + r.name + '</div>' +
      '<div class="popup-row">' + r.genre + '</div>' +
      '<div class="popup-row">月曜ランチ ' + r.mondayLunchHours + '</div>' +
      '<div class="popup-row">' + resLabel(r) + '</div>' +
      '<div class="popup-tip">' + r.tip + '</div>' +
      (links ? '<div class="popup-row">' + links + '</div>' : '');
  }

  restaurants.forEach(r => {
    const m = L.marker([r.lat, r.lng], { icon: pinIcon });
    m.bindPopup(popupHtml(r));
    m.on('click', () => selectRestaurant(r.id, false));
    markers[r.id] = m;
  });

  function filtered() {
    return restaurants.filter(r => {
      if (!activeGenres.has(r.genre)) return false;
      if (resOnly && r.reservation !== 'yes') return false;
      return true;
    }).sort((a, b) => a.name.localeCompare(b.name, 'ja'));
  }

  function selectRestaurant(id, pan) {
    selectedId = id;
    Object.keys(markers).forEach(k => {
      const mk = markers[k];
      mk.setIcon(Number(k) === id ? pinActive : pinIcon);
    });
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('active', Number(c.dataset.id) === id);
    });
    const r = restaurants.find(x => x.id === id);
    if (r && markers[id]) {
      markers[id].openPopup();
      if (pan) map.setView([r.lat, r.lng], Math.max(map.getZoom(), 16), { animate: true });
      const el = document.querySelector('.card[data-id="' + id + '"]');
      if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function refresh() {
    const items = filtered();
    document.getElementById('countBadge').textContent = items.length + '件';
    const list = document.getElementById('list');
    list.innerHTML = '';
    if (!items.length) {
      list.innerHTML = '<div class="empty">条件に合う店がありません</div>';
    }
    const visibleIds = new Set(items.map(r => r.id));
    restaurants.forEach(r => {
      const m = markers[r.id];
      if (visibleIds.has(r.id)) {
        if (!map.hasLayer(m)) m.addTo(map);
      } else if (map.hasLayer(m)) {
        map.removeLayer(m);
      }
    });
    items.forEach(r => {
      const div = document.createElement('div');
      div.className = 'card' + (selectedId === r.id ? ' active' : '');
      div.dataset.id = r.id;
      div.innerHTML =
        '<div class="name">' + r.name + '</div>' +
        '<div class="meta">' +
          '<span class="pill">' + r.genre + '</span>' +
          '<span class="pill ' + resClass(r) + '">' + resLabel(r) + '</span>' +
        '</div>' +
        '<div class="meta">月曜 ' + r.mondayLunchHours + '</div>' +
        '<div class="tip">' + r.tip + '</div>' +
        (r.officialUrl
          ? '<div class="meta"><a class="popup-link" href="' + r.officialUrl + '" target="_blank" rel="noopener">公式サイト</a></div>'
          : '');
      div.addEventListener('click', () => selectRestaurant(r.id, true));
      list.appendChild(div);
    });
  }

  refresh();
  const bounds = L.latLngBounds(restaurants.map(r => [r.lat, r.lng]));
  map.fitBounds(bounds, { padding: [40, 40] });
  setTimeout(() => map.invalidateSize(), 100);
})();
</script>
